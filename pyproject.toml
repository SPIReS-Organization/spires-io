[build-system]
requires = ["setuptools>=61.0", "wheel", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "spires-io"
dynamic = ["version"]  # version derived from git tags via setuptools_scm
description = "SPIReS I/O: MODIS/Sentinel-2/Landsat loaders, reprojection, and coordinate transforms"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Niklas Griessbaum" }]
keywords = ["snow", "remote sensing", "xarray", "MODIS", "Sentinel-2", "Landsat"]
dependencies = [
    "numpy",
    "xarray",
    "h5py",
    "rasterio",
    "affine",
    "netCDF4",
    "pyproj",
    "rioxarray",
]

[project.optional-dependencies]
test = ["pytest", "spires-contract"]

[project.urls]
Homepage = "https://github.com/SPIReS-Organization/spires-io"
Repository = "https://github.com/SPIReS-Organization/spires-io"

[tool.setuptools.packages.find]
where = ["./"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["./"]

[tool.setuptools_scm]
version_scheme = "post-release"
local_scheme = "node-and-date"
